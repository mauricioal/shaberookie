[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "shaberookie"
version = "0.1.0"
description = "AI-powered Japanese conversation assistant tailored to the learner's JLPT level."
authors = ["Shaberookie Team"]
license = "MIT"
readme = "README.md"
packages = [{ include = "shaberookie", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27.0"
pydantic = "^2.6.3"
python-dotenv = "^1.0.1"
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-community = "^0.3.0"
numpy = "^2.1.0"
gradio = "^4.31.4"
rich = "^13.7.1"
tenacity = "^8.2.3"
redis = { version = "^5.0.3", optional = true }
orjson = "^3.10.0"
typer = { extras = ["all"], version = "^0.12.3" }
click = "==8.1.7"
python-json-logger = "^2.0.7"

[tool.poetry.extras]
cache = ["redis"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-mock = "^3.14.0"
coverage = "^7.4.4"
mypy = "^1.9.0"
ruff = "^0.4.1"
black = "^24.3.0"
isort = "^5.13.2"
responses = "^0.25.0"
types-redis = "^4.6.0.20240425"
types-requests = "^2.31.0.20240406"

[tool.poetry.scripts]
shaberookie = "shaberookie.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["shaberookie"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["shaberookie"]
branch = true
omit = [
  "tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2